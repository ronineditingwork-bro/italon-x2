# Каждый день в 9:00 по Москве: прайс Mapei из кабинета поставщика → цены, склад Краснодар, фото → ветка сервера (сайт обновится сам).
# Логин и пароль кабинета — секреты репозитория LK_USER и LK_PASS (Settings → Secrets and variables → Actions).
# Запустить вручную: Actions → «Прайс Mapei: ежедневное обновление» → Run workflow.
# Изменений нет — коммита нет. Выгрузка не прошла проверку или упали тесты — сайт не трогаем, GitHub пришлёт письмо об ошибке.
name: "Прайс Mapei: ежедневное обновление"
on:
  schedule:
    - cron: '0 6 * * *'          # 06:00 UTC = 09:00 МСК (GitHub может запустить с опозданием до получаса)
  workflow_dispatch:
permissions:
  contents: write
concurrency: mapei-daily
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-943f3ebb-rcco8n   # ветка, из которой сервер собирает сайт
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: python3 -m pip install --quiet pillow
      - name: Выгрузка из кабинета поставщика
        env:
          LK_USER: ${{ secrets.LK_USER }}
          LK_PASS: ${{ secrets.LK_PASS }}
        run: node scripts/mapei-export.cjs "$RUNNER_TEMP/mapei.xml"
      - run: python3 scripts/import-mapei.py "$RUNNER_TEMP/mapei.xml"
      - run: npm run check && npm test
      - name: Отправить на сайт
        run: |
          git add data/mapei-price.json data/grout-colors.json public/media/mapei
          if git diff --cached --quiet; then echo "Прайс не изменился"; exit 0; fi
          git -c user.name="mapei-daily" -c user.email="actions@github.com" commit -m "Прайс Mapei: цены и склад Краснодар на $(date -u +%d.%m.%Y)"
          git push origin HEAD:ccr-943f3ebb-rcco8n
