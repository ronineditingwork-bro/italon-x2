# Необязательный путь: перенос проверенного коммита в ветку release. НЕ ЯВЛЯЕТСЯ рекомендуемым: у личного публичного репозитория нельзя ограничить запись в release «только Actions»
# (ops/release.md, §6), поэтому доверие обеспечивает сервер сам (hosting/release/verify-ci.py). ВЫКЛЮЧЕН ПО УМОЛЧАНИЮ: работает только при переменной RELEASE_PROMOTION=true.
# Запускается только после УСПЕШНОГО CI на ветке main; переносит коммит «вперёд» (fast-forward), без принудительной записи.
name: Promote release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: promote-release
  cancel-in-progress: false
jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.RELEASE_PROMOTION == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Это всё ещё верхушка main?
        run: |
          git fetch origin main
          [ "$(git rev-parse origin/main)" = "${{ github.event.workflow_run.head_sha }}" ] || { echo "main уже ушла вперёд — переносить будет следующий запуск"; exit 0; }
          echo "promote=1" >> "$GITHUB_ENV"
      - name: Перенос в release (только fast-forward)
        if: env.promote == '1'
        run: |
          git fetch origin release || true
          if git rev-parse -q --verify origin/release >/dev/null; then git merge-base --is-ancestor origin/release HEAD || { echo "::error::release не является предком main — автоматически не переношу"; exit 1; }; fi
          git push origin "HEAD:refs/heads/release"
          git tag -a "release-$(date -u +%Y%m%d-%H%M)-$(git rev-parse --short HEAD)" -m "Проверено CI" && git push origin --tags
