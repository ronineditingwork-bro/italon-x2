name: Verify Outdoor Lab changes
on:
  push:
    branches:
      - gpt6/outdoor-telegram-fix-20261024
  pull_request:
    branches:
      - ccr-943f3ebb-rcco8n

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:hosting
      - run: npm run build
